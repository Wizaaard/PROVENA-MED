[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provena-med"
version = "0.1.0"
description = "PROVENA-MED: a clinician-free, provenance-faithful, multimodal clinical-reasoning benchmark."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["medical", "clinical", "mimic", "benchmark", "provenance", "faithfulness", "multimodal", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "torch>=2.4",
  "transformers>=4.45",
  "accelerate>=0.34",
  "sentence-transformers>=3.0",
  "huggingface_hub>=0.24",
  "pyarrow>=15.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
vision = [
  "pillow>=10.0",
  "pydicom>=2.4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
provena-med = "provena_med.cli:main"

[project.urls]
"Source"        = "https://huggingface.co/datasets/anonymous/provena-med"
"Issue Tracker" = "https://huggingface.co/datasets/anonymous/provena-med/discussions"

[tool.setuptools.packages.find]
include = ["provena_med*"]
exclude = ["examples*", "scripts*", "docs*", "tests*"]

[tool.setuptools.package-data]
"provena_med" = ["data/rules/*.json", "data/rules/*.jsonl", "tasks/templates/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
